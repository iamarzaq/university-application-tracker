!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h2>🎓 University Application Tracker</h2>

<div class="card">
<h3>1. Authentication</h3>
<p style="font-size: 14px; color: #555;">Your API is locked. Generate a token to bypass the security guard.</p>
<button onclick="login()">Generate Security Token</button>
<p id="token-status" style="color: green; font-size: 14px; font-weight: bold;"></p>
</div>

<div class="card">
<h3>2. Add Application</h3>
<form id="appForm" onsubmit="addApp(event)">
<input type="text" id="uni" placeholder="University (e.g. TU Berlin)">
<input type="text" id="course" placeholder="Course (e.g. Computer Science)">
<input type="text" id="status" placeholder="Status (e.g. Shortlisted)">
<button type="submit">Submit to API</button>
</form>
<p id="form-error" style="color: red; font-size: 14px; font-weight: bold;"></p>
</div>

<div class="card">
<h3>3. My Applications Database</h3>
<div id="appList"></div>
</div>

<script src="script.js"></script>
</body>
</html>
